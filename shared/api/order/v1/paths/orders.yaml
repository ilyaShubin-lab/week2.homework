post:
  operationId: CreateOrder
  summary: Создать заказ
  tags: [Order]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/create_order_request.yaml'
  responses:
    '200':
      description: Заказ создан
      content:
        application/json:
          schema:
            $ref: '../components/create_order_response.yaml'
    '400':
      description: Невалидный запрос или детали не найдены
      content:
        application/json:
          schema:
            $ref: '../components/errors/bad_request_error.yaml'
    '500':
      description: Внутренняя ошибка
      content:
        application/json:
          schema:
            $ref: '../components/errors/internal_server_error.yaml'
    '502':
      description: InventoryService недоступен
      content:
        application/json:
          schema:
            $ref: '../components/errors/bad_gateway_error.yaml'
    default:
      description: Непредвиденная ошибка
      content:
        application/json:
          schema:
            $ref: '../components/errors/generic_error.yaml'