post:
  operationId: PayOrder
  summary: Оплатить заказ
  tags: [Order]
  parameters:
    - $ref: '../params/order_uuid.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/pay_order_request.yaml'
  responses:
    '200':
      description: Заказ оплачен
      content:
        application/json:
          schema:
            $ref: '../components/pay_order_response.yaml'
    '400':
      description: Невалидный способ оплаты
      content:
        application/json:
          schema:
            $ref: '../components/errors/bad_request_error.yaml'
    '404':
      description: Заказ не найден
      content:
        application/json:
          schema:
            $ref: '../components/errors/not_found_error.yaml'
    '409':
      description: Заказ уже оплачен или отменён
      content:
        application/json:
          schema:
            $ref: '../components/errors/conflict_error.yaml'
    '500':
      description: Внутренняя ошибка
      content:
        application/json:
          schema:
            $ref: '../components/errors/internal_server_error.yaml'
    '502':
      description: PaymentService недоступен
      content:
        application/json:
          schema:
            $ref: '../components/errors/bad_gateway_error.yaml'
    default:
      description: Непредвиденная ошибка
      content:
        application/json:
          schema:
            $ref: '../components/errors/generic_error.yaml'