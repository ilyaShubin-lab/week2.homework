version: v1
managed:
  enabled: true
  go_package_prefix:
    default: boilerplates/shared/pkg/proto
    except:
      - buf.build/googleapis/googleapis
plugins:
  - plugin: buf.build/protocolbuffers/go
    out: ../pkg/proto
    opt: paths=source_relative
  - plugin: buf.build/grpc/go
    out: ../pkg/proto
    opt: paths=source_relative